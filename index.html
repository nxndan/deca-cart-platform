<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b2a99">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IndyDECA">
<title>IndyDECA Store Register</title>
<style>
  :root {
    --brand: #5b2a99;
    --brand-dark: #3f1a70;
    --brand-soft: #f0e9fa;
    --brand-tint: #faf6ff;
    --gold: #f5b700;
    --bg: #f5f3f9;
    --card: #ffffff;
    --text: #1d1a26;
    --muted: #6d6880;
    --border: #e4dfee;
    --red: #d64545;
    --green: #1f9d55;
    --radius: 14px;
    --shadow: 0 1px 3px rgba(30, 16, 50, .08), 0 1px 2px rgba(30, 16, 50, .04);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --hdr-h: calc(56px + var(--safe-top));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh; min-height: 100dvh;
    -webkit-text-size-adjust: 100%;
  }
  body.no-scroll { overflow: hidden; }
  button { font-family: inherit; cursor: pointer; touch-action: manipulation; }
  .hidden { display: none !important; }

  /* ---------- Lock screen ---------- */
  #lock {
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, var(--brand) 0%, var(--brand-dark) 100%);
    padding: calc(24px + var(--safe-top)) 20px calc(24px + var(--safe-bottom));
  }
  .lock-card {
    background: var(--card); border-radius: 22px; padding: 32px 26px;
    width: 100%; max-width: 360px; text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,.25);
  }
  .logo {
    display: inline-block; font-weight: 800; letter-spacing: .5px;
    color: var(--brand); font-size: 30px;
  }
  .logo span { color: var(--gold); }
  .lock-card p { color: var(--muted); margin: 6px 0 22px; }
  .dots { display: flex; justify-content: center; gap: 14px; margin-bottom: 10px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--brand); transition: background .15s; }
  .dot.filled { background: var(--brand); }
  .lock-error { color: var(--red); font-size: 14px; height: 20px; margin-bottom: 8px; }
  .shake { animation: shake .35s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .key {
    height: 64px; border-radius: 16px; border: 1px solid var(--border);
    background: #faf8fd; font-size: 24px; font-weight: 600; color: var(--text);
  }
  .key:active { background: var(--brand-soft); }
  .key.ghost { background: transparent; border-color: transparent; font-size: 16px; color: var(--muted); }

  /* ---------- Header ---------- */
  header {
    position: sticky; top: 0; z-index: 20; height: var(--hdr-h);
    background: var(--brand); color: #fff;
    padding: var(--safe-top) 16px 0; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  header .brand { display: flex; align-items: baseline; min-width: 0; white-space: nowrap; overflow: hidden; }
  header .logo { color: #fff; font-size: 21px; }
  header .sub { font-size: 14px; opacity: .85; margin-left: 8px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
  .hdr-btn {
    flex-shrink: 0; background: rgba(255,255,255,.18); color: #fff; border: 0;
    padding: 9px 14px; border-radius: 10px; font-size: 14px; font-weight: 600;
  }

  /* ---------- Register layout ---------- */
  .layout { display: flex; gap: 20px; max-width: 1400px; margin: 0 auto; padding: 0 20px 20px; }
  .products { flex: 1; min-width: 0; padding-bottom: 24px; }
  .toolbar {
    position: sticky; top: var(--hdr-h); z-index: 10;
    background: var(--bg); padding: 14px 0 6px; margin-bottom: 4px;
  }
  .search {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border);
    font-size: 16px; background: var(--card); margin-bottom: 10px; outline: none; -webkit-appearance: none; appearance: none;
  }
  .search:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0; white-space: nowrap; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 14px; font-weight: 600;
  }
  .tab.active { background: var(--brand); border-color: var(--brand); color: #fff; }
  .cat-title { font-size: 14px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin: 18px 4px 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .prod {
    position: relative; text-align: left; background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 12px 12px; min-height: 96px;
    display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: var(--shadow); transition: transform .08s, border-color .15s;
  }
  .prod:active { transform: scale(.97); }
  .prod.in-cart { border-color: var(--brand); background: var(--brand-tint); }
  .prod .name { font-size: 14px; font-weight: 600; line-height: 1.25; color: var(--text); padding-right: 26px; word-break: break-word; }
  .prod .price { margin-top: 10px; font-size: 17px; font-weight: 800; color: var(--brand); }
  .badge {
    position: absolute; top: 8px; right: 8px; min-width: 24px; height: 24px; padding: 0 6px;
    border-radius: 12px; background: var(--brand); color: #fff; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .empty-search { color: var(--muted); text-align: center; padding: 40px 0; }

  /* ---------- Cart ---------- */
  .cart {
    width: 360px; flex-shrink: 0; background: var(--card); border-radius: 18px; border: 1px solid var(--border);
    box-shadow: var(--shadow); position: sticky; top: calc(var(--hdr-h) + 14px); align-self: flex-start; margin-top: 14px;
    max-height: calc(100vh - var(--hdr-h) - 28px); max-height: calc(100dvh - var(--hdr-h) - 28px);
    display: flex; flex-direction: column;
  }
  .cart-head { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .cart-head h2 { margin: 0; font-size: 18px; }
  .close-btn { display: none; background: var(--brand-soft); color: var(--brand); border: 0; border-radius: 10px; padding: 8px 14px; font-size: 14px; font-weight: 700; }
  .cart-items { flex: 1; overflow-y: auto; padding: 4px 0; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .cart-empty { color: var(--muted); text-align: center; padding: 36px 18px; font-size: 14px; }
  .line { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-bottom: 1px solid #f3f0f8; }
  .line-info { flex: 1; min-width: 0; }
  .line-name { font-size: 14px; font-weight: 600; word-break: break-word; }
  .line-unit { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .qty { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .qty button {
    width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border);
    background: #faf8fd; font-size: 20px; font-weight: 700; color: var(--text); line-height: 1;
  }
  .qty button:active { background: var(--brand-soft); }
  .qty span { min-width: 22px; text-align: center; font-weight: 700; }
  .line-total { width: 64px; flex-shrink: 0; text-align: right; font-weight: 700; font-size: 14px; }

  /* Totals */
  .calc { border-top: 1px solid var(--border); padding: 14px 18px 18px; background: #fbfafd; border-radius: 0 0 18px 18px; }
  .calc-row { display: flex; justify-content: space-between; font-size: 15px; color: var(--muted); margin-bottom: 4px; }
  .calc-total { display: flex; justify-content: space-between; align-items: baseline; margin: 4px 0 14px; }
  .calc-total .lbl { font-size: 17px; font-weight: 700; }
  .calc-total .amt { font-size: 32px; font-weight: 800; color: var(--brand); }
  .calc-actions { display: flex; gap: 10px; }
  .btn-clear {
    flex: 0 0 auto; padding: 15px 18px; border-radius: 12px; border: 1px solid var(--border);
    background: #fff; color: var(--red); font-size: 16px; font-weight: 700;
  }
  .btn-clear:disabled { color: #c9c3d4; cursor: not-allowed; }
  .btn-primary {
    width: 100%; padding: 15px; border-radius: 12px; border: 0; background: var(--brand); color: #fff;
    font-size: 17px; font-weight: 700;
  }
  .calc-actions .btn-primary { flex: 1; }
  .btn-primary:disabled { background: #c6b8dc; cursor: not-allowed; }
  .btn-primary:not(:disabled):active { background: var(--brand-dark); }
  .btn-secondary {
    width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: #fff; color: var(--text);
    font-size: 16px; font-weight: 600;
  }

  /* Order bar + bottom sheet (phones and tablets in portrait) */
  .cart-bar { display: none; }
  @media (max-width: 900px) {
    .layout { padding: 0 14px 14px; }
    .products { padding-bottom: calc(96px + var(--safe-bottom)); }
    .cart {
      position: fixed; left: 0; right: 0; bottom: 0; top: auto; width: auto; margin: 0;
      max-height: 85vh; max-height: 85dvh;
      border-radius: 22px 22px 0 0; z-index: 40; transform: translateY(105%); transition: transform .25s ease;
      visibility: hidden;
    }
    .cart.open { transform: translateY(0); visibility: visible; }
    .cart-head { position: relative; padding-top: 22px; }
    .cart-head::before {
      content: ""; position: absolute; top: 8px; left: 50%; width: 40px; height: 5px; margin-left: -20px;
      border-radius: 3px; background: var(--border);
    }
    .close-btn { display: inline-block; }
    .calc { border-radius: 0; padding-bottom: calc(18px + var(--safe-bottom)); }
    .cart-bar {
      display: flex; position: fixed; left: 14px; right: 14px; bottom: calc(14px + var(--safe-bottom)); z-index: 30;
      background: var(--brand); color: #fff; border: 0; border-radius: 16px; padding: 16px 20px;
      justify-content: space-between; align-items: center; font-size: 17px; font-weight: 700;
      box-shadow: 0 8px 24px rgba(91,42,153,.35);
    }
    .scrim { position: fixed; inset: 0; background: rgba(20,10,40,.45); z-index: 35; }
  }
  /* Tablets in portrait: keep the sheet a comfortable width */
  @media (min-width: 600px) and (max-width: 900px) {
    .cart { left: 50%; right: auto; width: 560px; margin-left: -280px; }
    .cart-bar { left: 50%; right: auto; width: 560px; margin-left: -280px; }
  }
  /* Tablets in landscape / small laptops */
  @media (min-width: 901px) and (max-width: 1180px) {
    .layout { gap: 16px; padding: 0 16px 16px; }
    .cart { width: 320px; }
  }
  /* Phones */
  @media (max-width: 599px) {
    header { padding-left: 14px; padding-right: 14px; }
    header .logo { font-size: 19px; }
    header .sub { font-size: 13px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .prod { min-height: 88px; padding: 12px 10px 10px; }
    .prod .name { font-size: 13.5px; }
    .prod .price { font-size: 16px; }
    .cat-title { margin: 14px 2px 8px; }
    .line { padding: 10px 14px; gap: 8px; }
    .calc { padding-left: 14px; padding-right: 14px; }
  }

  /* ---------- Modal (confirm / success) ---------- */
  .modal-wrap {
    position: fixed; inset: 0; background: rgba(20,10,40,.55); z-index: 100;
    display: flex; align-items: center; justify-content: center;
    padding: calc(16px + var(--safe-top)) 16px calc(16px + var(--safe-bottom));
  }
  .modal {
    background: var(--card); border-radius: 22px; width: 100%; max-width: 460px;
    max-height: 100%; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.3);
  }
  .modal-head { padding: 20px 22px 12px; }
  .modal-head h2 { margin: 0 0 4px; font-size: 22px; }
  .modal-head p { margin: 0; color: var(--muted); font-size: 14px; }
  .modal-body { padding: 0 22px; overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
  .rcpt-line { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px dashed var(--border); font-size: 15px; }
  .rcpt-line .q { color: var(--muted); margin-right: 6px; }
  .rcpt-sub { display: flex; justify-content: space-between; padding: 12px 0 4px; color: var(--muted); font-size: 15px; }
  .final-box { background: var(--brand-soft); border-radius: 14px; padding: 14px 16px; margin: 12px 0 6px; }
  .final-box label { display: block; font-size: 13px; font-weight: 700; color: var(--brand); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .final-input { display: flex; align-items: center; background: #fff; border-radius: 10px; border: 2px solid var(--brand); padding: 0 12px; }
  .final-input span { font-size: 28px; font-weight: 800; color: var(--brand); }
  .final-input input { border: 0; outline: none; width: 100%; font-size: 30px; font-weight: 800; color: var(--brand); padding: 8px 6px; background: transparent; font-family: inherit; }
  .adj-note { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 18px; }
  .adj-note.diff { color: #b26a00; font-weight: 600; }
  .reset-price { background: none; border: 0; color: var(--brand); font-weight: 600; font-size: 13px; padding: 0; margin-left: 6px; text-decoration: underline; }
  .modal-foot { padding: 16px 22px 22px; display: flex; flex-direction: column; gap: 10px; }
  .submit-error { color: var(--red); font-size: 14px; text-align: center; }
  .success-icon {
    width: 72px; height: 72px; border-radius: 50%; background: #e6f6ed; color: var(--green);
    display: flex; align-items: center; justify-content: center; margin: 26px auto 10px; font-size: 38px; font-weight: 800;
  }
  .center { text-align: center; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -3px; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 599px) {
    .modal-wrap { align-items: flex-end; padding: calc(12px + var(--safe-top)) 0 0; }
    .modal { max-width: none; border-radius: 22px 22px 0 0; }
    .modal-foot { padding-bottom: calc(22px + var(--safe-bottom)); }
    .modal-wrap .modal.center { margin-bottom: 0; }
  }
</style>
</head>
<body>

<!-- ================= LOCK SCREEN ================= -->
<section id="lock">
  <div class="lock-card" id="lockCard">
    <div class="logo">IndyDECA<span>.</span></div>
    <p>Store Register &mdash; enter passcode</p>
    <div class="dots" id="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div class="lock-error" id="lockError"></div>
    <div class="keypad" id="keypad"></div>
  </div>
</section>

<!-- ================= REGISTER ================= -->
<section id="app" class="hidden">
  <header>
    <div class="brand"><span class="logo">IndyDECA<span>.</span></span><span class="sub">Store Register</span></div>
    <button class="hdr-btn" id="lockBtn">Lock</button>
  </header>

  <div class="layout">
    <main class="products">
      <div class="toolbar">
        <input class="search" id="search" type="search" placeholder="Search products..." autocomplete="off" enterkeyhint="search">
        <div class="tabs" id="tabs"></div>
      </div>
      <div id="productList"></div>
    </main>

    <aside class="cart" id="cart" aria-label="Current order">
      <div class="cart-head">
        <h2>Current Order</h2>
        <button class="close-btn" id="closeCartBtn">Done</button>
      </div>
      <div class="cart-items" id="cartItems"></div>

      <div class="calc">
        <div class="calc-row"><span>Items</span><span id="itemCount">0</span></div>
        <div class="calc-total"><span class="lbl">Total</span><span class="amt" id="total">$0.00</span></div>
        <div class="calc-actions">
          <button class="btn-clear" id="clearBtn" disabled>Clear</button>
          <button class="btn-primary" id="reviewBtn" disabled>Review &amp; Submit</button>
        </div>
      </div>
    </aside>
  </div>

  <div class="scrim hidden" id="scrim"></div>
  <button class="cart-bar" id="cartBar"><span id="cartBarCount">View order (0)</span><span id="cartBarTotal">$0.00</span></button>
</section>

<!-- ================= CONFIRM MODAL ================= -->
<div class="modal-wrap hidden" id="confirmModal">
  <div class="modal">
    <div class="modal-head">
      <h2>Confirm Order</h2>
      <p>Check the items and the final price before submitting.</p>
    </div>
    <div class="modal-body">
      <div id="rcptLines"></div>
      <div class="rcpt-sub"><span>Calculated total</span><span id="rcptSubtotal">$0.00</span></div>
      <div class="final-box">
        <label for="finalPrice">Final price charged</label>
        <div class="final-input"><span>$</span><input id="finalPrice" type="number" inputmode="decimal" min="0" step="0.01"></div>
        <div class="adj-note" id="adjNote"></div>
      </div>
    </div>
    <div class="modal-foot">
      <div class="submit-error hidden" id="submitError"></div>
      <button class="btn-primary" id="submitBtn">Submit Order</button>
      <button class="btn-secondary" id="backBtn">Back to Order</button>
    </div>
  </div>
</div>

<!-- ================= SUCCESS MODAL ================= -->
<div class="modal-wrap hidden" id="successModal">
  <div class="modal center">
    <div class="success-icon">&#10003;</div>
    <div class="modal-head">
      <h2>Order Recorded</h2>
      <p id="successText"></p>
    </div>
    <div class="modal-foot">
      <button class="btn-primary" id="newOrderBtn">Start New Order</button>
    </div>
  </div>
</div>

PRODUCTS.forEach((p, i) => p.id = i);

/* =====================================================================
   STATE / HELPERS
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const money = (n) => "$" + (Math.round(n * 100) / 100).toFixed(2);
const round2 = (n) => Math.round(n * 100) / 100;
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const CATEGORIES = ["All", ...new Set(PRODUCTS.map(p => p.cat))];

let cart = [];          // [{ id, qty }] in the order items were added
let activeCat = "All";
let pin = "";

function cartTotal() { return round2(cart.reduce((s, l) => s + PRODUCTS[l.id].price * l.qty, 0)); }
function cartCount() { return cart.reduce((s, l) => s + l.qty, 0); }

/* =====================================================================
   LOCK SCREEN
   ===================================================================== */
function buildKeypad() {
  const keys = ["1","2","3","4","5","6","7","8","9","clear","0","del"];
  $("keypad").innerHTML = keys.map(k => {
    if (k === "clear") return `<button class="key ghost" data-k="clear">Clear</button>`;
    if (k === "del") return `<button class="key ghost" data-k="del" aria-label="Delete">&#9003;</button>`;
    return `<button class="key" data-k="${k}">${k}</button>`;
  }).join("");
  $("keypad").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    pressKey(b.dataset.k);
  });
  document.addEventListener("keydown", e => {
    if ($("lock").classList.contains("hidden")) return;
    if (/^[0-9]$/.test(e.key)) pressKey(e.key);
    else if (e.key === "Backspace") pressKey("del");
  });
}
function pressKey(k) {
  $("lockError").textContent = "";
  if (k === "clear") pin = "";
  else if (k === "del") pin = pin.slice(0, -1);
  else if (pin.length < 4) pin += k;
  renderDots();
  if (pin.length === 4) setTimeout(checkPin, 120);
}
function renderDots() {
  [...$("dots").children].forEach((d, i) => d.classList.toggle("filled", i < pin.length));
}
function checkPin() {
  if (pin === PASSCODE) {
    try { sessionStorage.setItem("deca_unlocked", "1"); } catch (e) {}
    unlock();
  } else {
    $("lockError").textContent = "Incorrect passcode";
    $("lockCard").classList.remove("shake"); void $("lockCard").offsetWidth; $("lockCard").classList.add("shake");
    pin = ""; renderDots();
  }
}
function unlock() { $("lock").classList.add("hidden"); $("app").classList.remove("hidden"); }
function lock() {
  try { sessionStorage.removeItem("deca_unlocked"); } catch (e) {}
  pin = ""; renderDots(); closeCart();
  $("app").classList.add("hidden"); $("lock").classList.remove("hidden");
}

/* =====================================================================
   PRODUCTS
   ===================================================================== */
function renderTabs() {
  $("tabs").innerHTML = CATEGORIES.map(c =>
    `<button class="tab ${c === activeCat ? "active" : ""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
}
function renderProducts() {
  const q = $("search").value.trim().toLowerCase();
  const qtyById = Object.fromEntries(cart.map(l => [l.id, l.qty]));
  let list = PRODUCTS.filter(p => (activeCat === "All" || p.cat === activeCat) && (!q || p.name.toLowerCase().includes(q)));
  if (!list.length) { $("productList").innerHTML = `<div class="empty-search">No products match "${esc(q)}"</div>`; return; }

  const cats = [...new Set(list.map(p => p.cat))];
  $("productList").innerHTML = cats.map(c => `
    <div class="cat-title">${esc(c)}</div>
    <div class="grid">
      ${list.filter(p => p.cat === c).map(p => `
        <button class="prod ${qtyById[p.id] ? "in-cart" : ""}" data-id="${p.id}">
          ${qtyById[p.id] ? `<span class="badge">${qtyById[p.id]}</span>` : ""}
          <span class="name">${esc(p.name)}</span>
          <span class="price">${money(p.price)}</span>
        </button>`).join("")}
    </div>`).join("");
}

/* =====================================================================
   CART + TOTALS
   ===================================================================== */
function addItem(id) {
  const line = cart.find(l => l.id === id);
  if (line) line.qty++; else cart.push({ id, qty: 1 });
  render();
}
function changeQty(id, delta) {
  const line = cart.find(l => l.id === id); if (!line) return;
  line.qty += delta;
  if (line.qty <= 0) cart = cart.filter(l => l.id !== id);
  render();
}
function renderCart() {
  if (!cart.length) {
    $("cartItems").innerHTML = `<div class="cart-empty">Tap a product to add it to the order.</div>`;
  } else {
    $("cartItems").innerHTML = cart.map(l => {
      const p = PRODUCTS[l.id];
      return `<div class="line">
        <div class="line-info"><div class="line-name">${esc(p.name)}</div><div class="line-unit">${money(p.price)} each</div></div>
        <div class="qty"><button data-dec="${p.id}" aria-label="Remove one">&minus;</button><span>${l.qty}</span><button data-inc="${p.id}" aria-label="Add one">+</button></div>
        <div class="line-total">${money(p.price * l.qty)}</div>
      </div>`;
    }).join("");
  }
  const total = cartTotal(), count = cartCount();
  $("itemCount").textContent = count;
  $("total").textContent = money(total);
  $("cartBarCount").textContent = `View order (${count})`;
  $("cartBarTotal").textContent = money(total);
  $("reviewBtn").disabled = !cart.length;
  $("clearBtn").disabled = !cart.length;
}
function render() { renderProducts(); renderCart(); }

function openCart() { $("cart").classList.add("open"); $("scrim").classList.remove("hidden"); document.body.classList.add("no-scroll"); }
function closeCart() { $("cart").classList.remove("open"); $("scrim").classList.add("hidden"); document.body.classList.remove("no-scroll"); }
function clearOrder() {
  if (cart.length && confirm("Clear the current order?")) { cart = []; render(); }
}

/* =====================================================================
   CONFIRM + SUBMIT
   ===================================================================== */
function openConfirm() {
  if (!cart.length) return;
  closeCart();
  const total = cartTotal();
  $("rcptLines").innerHTML = cart.map(l => {
    const p = PRODUCTS[l.id];
    return `<div class="rcpt-line"><span><span class="q">${l.qty}&times;</span>${esc(p.name)}</span><span>${money(p.price * l.qty)}</span></div>`;
  }).join("");
  $("rcptSubtotal").textContent = money(total);
  $("finalPrice").value = total.toFixed(2);
  $("submitError").classList.add("hidden");
  updateAdjNote();
  $("confirmModal").classList.remove("hidden");
  document.body.classList.add("no-scroll");
}
function closeConfirm() { $("confirmModal").classList.add("hidden"); document.body.classList.remove("no-scroll"); }
function updateAdjNote() {
  const total = cartTotal();
  const v = parseFloat($("finalPrice").value);
  const note = $("adjNote");
  if (isNaN(v)) { note.className = "adj-note diff"; note.textContent = "Enter a price."; return; }
  const diff = round2(v - total);
  if (diff === 0) { note.className = "adj-note"; note.textContent = "Matches calculated total. Tap the price to edit it."; }
  else {
    note.className = "adj-note diff";
    note.innerHTML = `${diff < 0 ? "Discount of " + money(-diff) : "Added " + money(diff)} from calculated total.<button class="reset-price" id="resetPrice">Reset</button>`;
  }
}

function submitOrder() {
  const final = parseFloat($("finalPrice").value);
  if (isNaN(final) || final < 0) { showSubmitError("Please enter a valid final price."); return; }

  const subtotal = cartTotal();
  const payload = {
    password: PASSCODE,
    orderId: makeOrderId(),
    clientTime: new Date().toISOString(),
    subtotal: subtotal,
    finalPrice: round2(final),
    items: cart.map(l => {
      const p = PRODUCTS[l.id];
      return { name: p.name, category: p.cat, price: p.price, qty: l.qty, lineTotal: round2(p.price * l.qty) };
    })
  };

  const btn = $("submitBtn");
  btn.disabled = true; btn.innerHTML = `<span class="spinner"></span>Submitting...`;
  $("submitError").classList.add("hidden");

  sendToSheet(payload)
    .then(res => {
      if (res && res.ok === false) throw new Error(res.error || "The sheet rejected the order.");
      $("confirmModal").classList.add("hidden");
      $("successText").innerHTML = `Order <b>${esc(payload.orderId)}</b> &middot; ${cartCount()} item${cartCount() === 1 ? "" : "s"} &middot; <b>${money(payload.finalPrice)}</b>`;
      $("successModal").classList.remove("hidden");
    })
    .catch(err => showSubmitError("Could not save order: " + (err && err.message ? err.message : err) + ". Check your connection and try again."))
    .finally(() => { btn.disabled = false; btn.textContent = "Submit Order"; });
}
function showSubmitError(msg) { const e = $("submitError"); e.textContent = msg; e.classList.remove("hidden"); }
function makeOrderId() {
  const d = new Date(), pad = n => String(n).padStart(2, "0");
  return `${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}-${Math.random().toString(36).slice(2, 5).toUpperCase()}`;
}

/* Sends the order to Google Sheets.
   - Inside Apps Script (HtmlService): uses google.script.run
   - Anywhere else: POSTs to SCRIPT_URL */
function sendToSheet(payload) {
  if (typeof google !== "undefined" && google.script && google.script.run) {
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).recordOrder(payload);
    });
  }
  if (!SCRIPT_URL) return Promise.reject(new Error("Google Sheet not connected yet (SCRIPT_URL is empty)"));
  return fetch(SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids CORS preflight
    body: JSON.stringify(payload)
  }).then(r => r.json());
}

function newOrder() {
  cart = []; $("search").value = "";
  $("successModal").classList.add("hidden");
  document.body.classList.remove("no-scroll");
  render();
  window.scrollTo({ top: 0 });
}

/* =====================================================================
   EVENTS
   ===================================================================== */
$("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  activeCat = b.dataset.cat; renderTabs(); renderProducts();
  $("tabs").querySelector(".tab.active").scrollIntoView({ block: "nearest", inline: "nearest" });
});
$("search").addEventListener("input", renderProducts);
$("productList").addEventListener("click", e => {
  const b = e.target.closest(".prod"); if (b) addItem(+b.dataset.id);
});
$("cartItems").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.inc) changeQty(+b.dataset.inc, 1);
  if (b.dataset.dec) changeQty(+b.dataset.dec, -1);
});
$("clearBtn").addEventListener("click", clearOrder);
$("reviewBtn").addEventListener("click", openConfirm);
$("cartBar").addEventListener("click", openCart);
$("closeCartBtn").addEventListener("click", closeCart);
$("scrim").addEventListener("click", closeCart);
$("finalPrice").addEventListener("input", updateAdjNote);
$("finalPrice").addEventListener("focus", e => e.target.select());
$("adjNote").addEventListener("click", e => { if (e.target.id === "resetPrice") { $("finalPrice").value = cartTotal().toFixed(2); updateAdjNote(); } });
$("backBtn").addEventListener("click", closeConfirm);
$("submitBtn").addEventListener("click", submitOrder);
$("newOrderBtn").addEventListener("click", newOrder);
$("lockBtn").addEventListener("click", lock);
window.addEventListener("resize", () => { if (window.innerWidth > 900 && $("cart").classList.contains("open")) closeCart(); });

/* =====================================================================
   INIT
   ===================================================================== */
buildKeypad();
renderTabs();
render();
try { if (sessionStorage.getItem("deca_unlocked") === "1") unlock(); } catch (e) {}
</script>
